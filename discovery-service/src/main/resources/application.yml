server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
    wait-time-in-ms-when-sync-empty: 0
  dashboard:
    path: /dashboard

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Disabled due to compatibility issues with Spring Boot 3.4.0
  # tracing:
  #   sampling:
  #     probability: 1.0

logging:
  level:
    com.scaler.discovery: INFO
    org.springframework.cloud.netflix.eureka: INFO
    org.springframework.web: INFO