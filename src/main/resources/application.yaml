spring:
  application:
    name: catalog-sqldb-poc
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_final_database
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
#    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
          implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        enable_lazy_load_no_trans: true
  sql:
    init:
      mode: always
      data-locations: 
#        - classpath:data.sql
#        - classpath:data-1.sql
#        - classpath:data-2.sql
      schema-locations:
#        - classpath:schema.sql
      continue-on-error: false
      platform: postgresql
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=600s
  security:
    user:
      name: admin
      password: admin
      roles: ADMIN
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: false

server:
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      file-date-format: yyyy-MM-dd
      prefix: access_log
      suffix: .log
      pattern: '%t %a "%r" %s %b %D ms'
  port: 8080
  servlet:
    context-path: /api

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    org.springframework: INFO
    com:
      scaler: DEBUG

# Application Configuration
application:
  loadDataFromCsv: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
