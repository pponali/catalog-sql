syntax = "proto3";
package com.scaler.vendor;

option java_multiple_files = true;
option java_package = "com.scaler.grpc.vendor";

service VendorService {
  // Seller operations
  rpc GetSeller (GetSellerRequest) returns (SellerResponse);
  rpc GetSellerProducts (GetSellerProductsRequest) returns (SellerProductListResponse);
  rpc GetSellerProduct (GetSellerProductRequest) returns (SellerProductResponse);
  rpc CreateSeller (CreateSellerRequest) returns (SellerResponse);
  rpc UpdateSeller (UpdateSellerRequest) returns (SellerResponse);
  rpc DeleteSeller (DeleteSellerRequest) returns (DeleteSellerResponse);
  
  // Merchant operations
  rpc GetMerchant (GetMerchantRequest) returns (MerchantResponse);
  rpc ValidateMerchantExists (ValidateMerchantExistsRequest) returns (ValidateMerchantExistsResponse);
}

message GetSellerRequest {
  string id = 1;
}

message GetSellerProductsRequest {
  string seller_id = 1;
  int32 page = 2;
  int32 size = 3;
}

message GetMerchantRequest {
  string id = 1;
}

message CreateSellerRequest {
  SellerMessage seller = 1;
}

message UpdateSellerRequest {
  SellerMessage seller = 1;
}

message DeleteSellerRequest {
  string id = 1;
}

message DeleteSellerResponse {
  bool success = 1;
  string message = 2;
}

message SellerResponse {
  SellerMessage seller = 1;
}

message MerchantResponse {
  MerchantMessage merchant = 1;
}

message SellerProductListResponse {
  repeated SellerProductMessage products = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 size = 4;
}

message SellerMessage {
  string id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
  string status = 5;
  string merchant_id = 6;
  string contact_email = 7;
  string contact_phone = 8;
  string created_at = 9;
  string updated_at = 10;
}

message MerchantMessage {
  string id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
  string business_unit = 5;
  string status = 6;
  string contact_email = 7;
  string contact_phone = 8;
  string created_at = 9;
  string updated_at = 10;
}

message SellerProductMessage {
  string id = 1;
  string seller_id = 2;
  string product_id = 3;
  double price = 4;
  int32 inventory = 5;
  string status = 6;
  string created_at = 7;
  string updated_at = 8;
}

// Message definitions for RPC methods
message GetSellerProductRequest {
  string seller_id = 1;
  string product_id = 2;
}

message SellerProductResponse {
  SellerProductMessage product = 1;
}

message ValidateMerchantExistsRequest {
  string merchant_id = 1;
}

message ValidateMerchantExistsResponse {
  bool exists = 1;
  MerchantMessage merchant = 2;
}